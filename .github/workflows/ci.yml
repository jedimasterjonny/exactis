name: CI

on:
  pull_request:
    # The default three, and ready_for_review, which is when the commit
    # checks below first run: a draft pays for the check job alone.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A superseded pull request run answers a question nobody is asking any more.
# A push is not the same: its run is the only thing that ever looks at those
# commits, and nothing revisits them, so cancelling one leaves them unchecked.
#
# cancel-in-progress: false does not promise that on its own, because a group
# holds one pending run and no more. A third run arriving to find the first
# still going and the second waiting cancels the second to take its place, and
# three merges in a row is all that takes. It is not a race that usually
# resolves in your favour either: 3ebd896 was queued at 22:37:52, and
# cancelled at 22:39:35, one second after the run behind it was created and
# having started no job at all. It reached main unchecked and was rerun by
# hand once somebody noticed, which is the part that does not scale.
#
# So a push is grouped by the commit it checks rather than by the branch it
# landed on. Alone in its group it waits for nothing and nothing waits for it,
# and cancel-in-progress stays an expression rather than becoming false,
# because what it says is still true of a pull request and now says it of a
# push as well. Merges to main are serial in practice, so the parallelism
# this allows is mostly theoretical; what it buys is that a run cannot be
# cancelled by a merge that had nothing to do with it.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref
    || github.sha }}

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # actions: read is for looking up the tree's marker, as the range job
    # does. Stated in full because a job's permissions replace the
    # workflow's rather than adding to them.
    permissions:
      actions: read
      contents: read
    steps:
      # Pinned to digests because renovate.json extends config:best-practices,
      # which includes helpers:pinGitHubActionDigests. Renovate keeps them
      # current; the comment is what makes the digest readable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint needs the commits a pull request adds, not just its tip.
          fetch-depth: 0
          # Nothing here pushes, so there is no reason to leave a token in
          # .git/config where every later step can read it.
          persist-credentials: false

      # A tree proven green once need not be proven again, which is the
      # range job's rule for the commits it lists and holds for the tip
      # too. A push to main lands by rebase, so its tip's tree is the one
      # the pull request's run already checked whenever the request was up
      # to date; marking a draft ready, or rewording a series, runs this
      # on a tree the last push checked. So the marker is looked up for
      # the tree checked out, and the scripts below are skipped when it is
      # found. What is not skipped is what a tree does not settle: the
      # audit reads an advisory database that moves, and commitlint reads
      # messages, which a rebase keeps but a marker says nothing about.
      # Both run every time, on an install that takes seconds.
      - id: proven
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          found="$(gh cache list --key "green-tree-$tree" --limit 1 --json key --jq length 2>/dev/null || echo 0)"
          if [ "$found" != "0" ]; then
            echo "Tree $tree is already proven green; running only the audit and commitlint."
            echo "proven=true" >> "$GITHUB_OUTPUT"
          else
            echo "proven=false" >> "$GITHUB_OUTPUT"
          fi
          echo "tree=$tree" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .node-version rather than written here, so the version
          # is stated once and Renovate's nodenv manager updates it in one
          # place. Pinned rather than inherited from the runner image, so an
          # image bump cannot silently change the version the suite runs under.
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Reads packageManager from package.json, so the version is stated
          # once and Renovate updates it in one place.
          bun-version-file: package.json

      # setup-bun does not do this, so the entry below is not redundant
      # config. Read at the digest pinned above: its post step is
      # cache-save.ts, whose body is saveCache([state.bunPath]) and nothing
      # else, and its one cache input is no-cache - "Disable caching of bun
      # executable". The binary is all it has ever meant.
      #
      # The path is asked of bun rather than written down. `bun pm cache`
      # resolves BUN_INSTALL_CACHE_DIR, else $BUN_INSTALL/install/cache, else
      # $XDG_CACHE_HOME/.bun/install/cache, else $HOME/.bun/install/cache -
      # confirmed by running it under each. setup-bun sets none of them, so a
      # hardcoded ~/.bun/install/cache is right today and silently a cache
      # that never hits the day one of them is set.
      - id: bun-cache
        run: |
          dir="$(bun pm cache)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: bun-check-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          # node_modules is deliberately not here and must not be added. bun
          # install --frozen-lockfile does not prune, so a restored tree
          # resolves a dependency the commit no longer declares and the run
          # goes green on a tree that cannot install - the false pass the
          # commit job avoids by starting every commit on a fresh runner.
          # The install cache cannot do that. It is content-addressed, keyed
          # by what was fetched rather than by what is wanted, so a stale
          # entry is dead weight rather than a wrong answer: it can only
          # make an install that was going to happen anyway faster.
          path: ${{ steps.bun-cache.outputs.dir }}
          # Prefixed per job rather than shared with the commit job. Each
          # keys on the lockfile it installs from, and a save onto a key
          # that exists is a no-op, so a shared prefix would race only on
          # identical content; the prefixes stay so a restore reads off its
          # key as the tip's or a commit's.
          restore-keys: bun-check-${{ runner.os }}-

      - id: install
        run: bun install --frozen-lockfile

      # Every check runs even after one fails, so a red run reports everything
      # that is wrong at once. Same reason the pre-commit hook passes
      # --continue-on-error. A failed install is the exception: without
      # node_modules each of these fails on a missing binary rather than on
      # anything it was asked to check, so they are gated on it succeeding.
      - if:
          ${{ !cancelled() && steps.install.outcome == 'success' &&
          steps.proven.outputs.proven != 'true' }}
        run: bun run format:check
      # A misspelled option in .prettierrc.json is answered with
      # `[warn] Ignored unknown option { printWdith: 80 }. Did you mean
      # printWidth?` on stderr, after which Prettier exits 0 and the step
      # above prints "All matched files use Prettier code style!". Verified
      # with printWdith and tailwindStylesheat together: two warnings, both
      # options doing nothing, format:check green. A plugin option is not a
      # special case - core and plugin options are normalised through the
      # same path, and tailwindStylesheat warns exactly like printWdith.
      #
      # There is no flag that promotes it. Prettier 3.9's CLI has no
      # strict-config equivalent - the whole option list was read, not
      # remembered - and --log-level only silences. Validating
      # .prettierrc.json against getSupportInfo() was tried and rejected:
      # it does work, but it is a second implementation of a check Prettier
      # already performs, one that has to be taught about plugins,
      # overrides and $schema and will go wrong differently. So what
      # Prettier prints is what gets read.
      #
      # format:check is re-run rather than one file probed, because the
      # warning is emitted per formatted file: a typo inside an overrides
      # block only surfaces on a file that override matches. The whole run
      # takes 0.3s. Only stderr is read - the pass/fail verdict belongs to
      # the step above, and failing here for it too would report one
      # problem as two.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          # A grep for a vendor's log line is a check only for as long as
          # the line exists, and Renovate keeps upgrading Prettier. Ask for
          # an option that cannot be real and require the message back.
          canary="$(bunx prettier --stdin-filepath canary.ts \
            --unknown-option-canary=1 </dev/null 2>&1 >/dev/null || true)"
          case "$canary" in
            *"Ignored unknown option"*) ;;
            *)
              echo "::error::Prettier no longer reports an unknown option this way; this check is dead and needs rewriting."
              exit 1
              ;;
          esac

          warnings="$(bun run format:check 2>&1 >/dev/null || true)"
          if printf '%s\n' "$warnings" | grep -q "Ignored unknown option"; then
            printf '%s\n' "$warnings" | grep "Ignored unknown option" | sort -u
            echo "::error::Prettier ignored an option in .prettierrc.json, so it is set to nothing. Fix the spelling."
            exit 1
          fi
      - if:
          ${{ !cancelled() && steps.install.outcome == 'success' &&
          steps.proven.outputs.proven != 'true' }}
        run: bun run lint
      - if:
          ${{ !cancelled() && steps.install.outcome == 'success' &&
          steps.proven.outputs.proven != 'true' }}
        run: bun run typecheck
      - if:
          ${{ !cancelled() && steps.install.outcome == 'success' &&
          steps.proven.outputs.proven != 'true' }}
        run: bun run test:coverage
      # vitest writes an HTML report alongside the text summary and nothing
      # has ever looked at it: the runner is thrown away, so a coverage
      # failure can only be read by reproducing the run locally. Gated on
      # the same condition as every other step rather than on the coverage
      # step succeeding, because a red run is the case this exists for.
      - if:
          ${{ !cancelled() && steps.install.outcome == 'success' &&
          steps.proven.outputs.proven != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # warn rather than error. A suite that died before writing a
          # report has already failed the step above, and failing again for
          # the missing artifact reports one problem as two.
          if-no-files-found: warn
          name: coverage-html
          # Where vitest puts it: coverage.reportsDirectory is unset in
          # vitest.config.mts, so the default, and .gitignore names the
          # same path.
          path: coverage/
          # Long enough to read a failure from the run that produced it.
          # This is a diagnostic, not coverage history.
          retention-days: 7
      # Kept alongside typecheck even though next build type checks too: a
      # type error should fail in seconds rather than after a full build, and
      # the build catches what tsc alone does not.
      - if:
          ${{ !cancelled() && steps.install.outcome == 'success' &&
          steps.proven.outputs.proven != 'true' }}
        run: bun run build
      # Nothing above reports a dependency that no file imports, or an export
      # that no file reads: both type check and lint perfectly. knip is the
      # only check here that looks for what is absent rather than what is
      # wrong.
      - if:
          ${{ !cancelled() && steps.install.outcome == 'success' &&
          steps.proven.outputs.proven != 'true' }}
        run: bun run knip

      # Dependabot alerts are on and Renovate raises a pull request for a
      # known vulnerability, but both arrive after the fact: the version is
      # on main by the time either notices. This fails the run that
      # introduces one - a bump pulling in a vulnerable transitive, or a
      # lockfile-maintenance refresh doing the same - at the pull request,
      # where it is cheapest to read. Not gated on the install: it reads
      # bun.lock rather than node_modules, and a lockfile that would not
      # install is still worth auditing.
      #
      # Every severity fails it. An advisory that cannot be fixed is
      # accepted with --ignore, the advisory named here and the reason
      # beside it, the same shape as an eslint-disable and its -- reason.
      # Not with --audit-level, which silences the next one too.
      #
      # GHSA-67mh-4wv8-2f99 is esbuild 0.18's development server answering
      # any origin, fixed in 0.25. The 0.18 copy arrives through
      # drizzle-kit, which declares @esbuild-kit/esm-loader and never loads
      # it: its bundled bin.cjs does not mention the package, and it
      # transpiles the config with the 0.25 esbuild it also declares. A
      # development server that is never started answers nobody. Nothing
      # here can drop the declaration, so the advisory is accepted until
      # drizzle-kit does.
      - if: ${{ !cancelled() }}
        run: bun audit --ignore GHSA-67mh-4wv8-2f99

      # The commit-msg hook is bypassable with --no-verify. This is not, and
      # it runs for a push as well as a pull request. Most of this history
      # landed by direct push to main, which a pull_request-only gate never
      # saw. Merge and squash commits are off in the repository settings, so
      # GitHub composes no message of its own, but a push still carries
      # whatever the author's hook let through or was told to skip.
      #
      # The SHAs go through the environment rather than into the command
      # string, so nothing from the event is interpolated into a shell. The
      # range logic is the commits job's, duplicated rather than shared: a
      # composite action would put it where neither job's comment can
      # explain it. With no usable range the tip is linted alone, from its
      # message on stdin rather than through --from, because a root commit
      # has no parent to name.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BASE_SHA:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" 2>/dev/null; then
            echo "No usable base commit, or history was rewritten; linting $HEAD_SHA alone."
            git log -1 --format=%B "$HEAD_SHA" | bunx commitlint --verbose
          else
            bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          fi

      # The marker the lookup above reads, saved under the tree's hash once
      # every step has passed and not otherwise: success() is false after
      # any failure, and the steps above carry on past one only so that a
      # red run reports everything. Not saved on the proven path, where it
      # already exists. What is saved does not matter; that the key exists
      # is the fact.
      - if: ${{ success() && steps.proven.outputs.proven != 'true' }}
        env:
          TREE: ${{ steps.proven.outputs.tree }}
        run: |
          mkdir -p .green
          echo "$TREE" > .green/tree
      - if: ${{ success() && steps.proven.outputs.proven != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: green-tree-${{ steps.proven.outputs.tree }}
          path: .green

  range:
    # AGENTS.md requires every commit to stand alone, not only the tip: each
    # one installs from its own lockfile and is green by itself. The check job
    # above only ever sees the tip, so a series that is green at the end and
    # red in the middle passes unnoticed - which is exactly what git bisect
    # later depends on not being true.
    #
    # This job lists the commits to check and the commit job below checks
    # them, one runner each. They used to be one job looping over the range,
    # and a series paid for its length in wall clock: four minutes a commit,
    # in order, so twelve were fifty minutes and the loop's timeout had to
    # grow with the longest series. Now a series pays in runners, all at
    # once, and takes as long as its slowest commit.
    #
    # Not while the pull request is a draft. A series is rewritten while it
    # is one, and each rewrite would spend a runner a commit proving a tree
    # the next push replaces; the check job still runs on every push, so a
    # draft is never unchecked, only its middle. Marking it ready runs this
    # for the first time, and every push after that runs it again. A push
    # to main is never a draft and always runs it.
    if:
      ${{ github.event_name != 'pull_request' ||
      !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read is for listing the cache, which is where the commit job
    # leaves its markers. Stated in full because a job's permissions replace
    # the workflow's rather than adding to them.
    permissions:
      actions: read
      contents: read
    outputs:
      commits: ${{ steps.list.outputs.commits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range is walked here, so the whole history is needed.
          fetch-depth: 0
          persist-credentials: false

      # The SHAs go through the environment rather than into the command
      # string, so nothing from the event is interpolated into a shell. The
      # range logic is the check job's commitlint step's, duplicated rather
      # than shared: a composite action would put it where neither comment
      # can explain it.
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          # The tip is the check job's: it runs every script there already,
          # on the same tree, and a second run here would answer nothing it
          # has not. So the range stops one short of the head.
          #
          # A new branch reports an all-zero base, and a force push can name a
          # commit that no longer resolves. Either way there is no range, and
          # the check job covers the one commit that can be named, so there is
          # nothing to check here rather than something to fail on.
          # A base that is not an ancestor of the head means history was
          # rewritten: the old tip usually still resolves, so resolvability
          # alone is not enough to detect it, and rev-list would then return
          # every rewritten commit rather than the ones actually pushed.
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" 2>/dev/null; then
            echo "No usable base commit, or history was rewritten; the check job covers $HEAD_SHA."
            commits=""
          else
            commits="$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}" | sed '$d')"
          fi

          # A commit is green standalone as a function of its tree alone,
          # so a tree proven once need not be proven again. The commit job
          # saves a marker under the tree's hash when every script passes,
          # as the check job does for the tree it checks, and the list
          # leaves out each commit whose tree has one: a push
          # that adds or amends one commit checks one commit. The markers
          # are looked up over the API rather than restored, since a
          # restore is one key a step and this is a list, and the API sees
          # every cache in the repository whichever branch wrote it, which
          # is right for a fact about a tree. A marker unused for a week is
          # evicted, and a rebase onto a moved main changes every tree;
          # either way the commit is checked again, which costs a runner
          # and nothing else. A lookup that fails is read as no marker, for
          # the same reason.
          #
          # One entry per commit, as the matrix takes it: the sha to check
          # out, the tree to mark, and the short sha and the subject to name
          # the job by. An empty range is an empty list, which the commit
          # job reads as nothing to do.
          list="$(for sha in $commits; do
            tree="$(git rev-parse "${sha}^{tree}")"
            found="$(gh cache list --key "green-tree-$tree" --limit 1 --json key --jq length 2>/dev/null || echo 0)"
            if [ "$found" != "0" ]; then
              echo "$(git rev-parse --short "$sha") is tree $tree, already proven green; skipped" >&2
              continue
            fi
            jq -n --arg sha "$sha" \
              --arg short "$(git rev-parse --short "$sha")" \
              --arg subject "$(git log -1 --format=%s "$sha")" \
              --arg tree "$tree" \
              '{sha: $sha, short: $short, subject: $subject, tree: $tree}'
          done | jq -sc .)"

          echo "Checking $(echo "$list" | jq length) commit(s), one job each."
          echo "commits=$list" >> "$GITHUB_OUTPUT"

  commit:
    needs: range
    if: ${{ needs.range.outputs.commits != '[]' }}
    name: commit ${{ matrix.short }} ${{ matrix.subject }}
    runs-on: ubuntu-latest
    # A guard against a hang, not a budget: one commit is about four
    # minutes, install and every script.
    timeout-minutes: 15
    strategy:
      # Every commit is reported, not only the first to fail, so a red
      # series says everything that is wrong with it at once.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.range.outputs.commits) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          # This job runs historical code. A token left in .git/config is
          # readable by it.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - id: bun-cache
        run: |
          dir="$(bun pm cache)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Keyed on this commit's own lockfile, which is what it installs
          # from. Most of a series shares one, so the first job to finish
          # saves the entry and the rest find it already there; a series
          # that changes the lockfile mid-way saves one entry per lockfile.
          # node_modules stays out for the reason given in the check job.
          key: bun-commits-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          path: ${{ steps.bun-cache.outputs.dir }}
          restore-keys: bun-commits-${{ runner.os }}-

      # A fresh runner, so there is nothing to clean: no node_modules from
      # another commit for bun install to leave unpruned, no stale
      # .next/types for tsc to read. The loop this replaced paid a
      # `git clean -xdff` per commit for exactly that.
      - env:
          SHORT: ${{ matrix.short }}
          SUBJECT: ${{ matrix.subject }}
        run: |
          set -uo pipefail

          ok=true
          bun install --frozen-lockfile || ok=false

          if [ "$ok" = true ]; then
            # Whatever this commit defines as green, not what the tip does.
            # A commit predating a script has not failed it. Absent is
            # exit 3 and nothing else: node answers an uncaught exception
            # with 1, so reading 1 as absent would turn a package.json
            # that cannot be parsed into a commit with nothing to run.
            # Any other status is the probe breaking, which is a failure
            # rather than a reason to skip.
            for script in format:check lint typecheck test:coverage build knip; do
              # The probe must not run bare: GitHub runs this with
              # `bash -e`, so a non-zero exit would abort the whole loop
              # before the code could be read. `|| probe=$?` puts it in an
              # OR list, which errexit exempts.
              probe=0
              node -e "process.exit(require('./package.json').scripts?.['$script'] ? 0 : 3)" || probe=$?
              if [ "$probe" -eq 3 ]; then
                echo "no $script script at this commit; skipped"
                continue
              fi
              if [ "$probe" -ne 0 ]; then
                echo "::error::probing for the $script script exited $probe"
                ok=false
                continue
              fi
              bun run "$script" || ok=false
            done
          fi

          if [ "$ok" = false ]; then
            echo "::error::$SHORT ($SUBJECT) is not green on its own"
            exit 1
          fi
          echo "$SHORT stands alone."

      # The marker the range job looks for, saved under the tree's hash
      # once every script has passed and not otherwise, since a failed step
      # above ends the job. What is saved does not matter; that the key
      # exists is the fact.
      - env:
          TREE: ${{ matrix.tree }}
        run: |
          mkdir -p .green
          echo "$TREE" > .green/tree
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: green-tree-${{ matrix.tree }}
          path: .green
