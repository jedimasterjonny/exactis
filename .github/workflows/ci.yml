name: CI

on:
  pull_request:
    # The default three, and ready_for_review, which is when the commit
    # checks below first run: a draft pays for provision and teardown and
    # nothing else, the gate itself running on runners GitHub does not
    # bill for.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

# A superseded pull request run answers a question nobody is asking any more.
# A push is not the same: its run is the only thing that ever looks at those
# commits, and nothing revisits them, so cancelling one leaves them unchecked.
#
# cancel-in-progress: false does not promise that on its own, because a group
# holds one pending run and no more. A third run arriving to find the first
# still going and the second waiting cancels the second to take its place, and
# three merges in a row is all that takes. It is not a race that usually
# resolves in your favour either: 3ebd896 was queued at 22:37:52, and
# cancelled at 22:39:35, one second after the run behind it was created and
# having started no job at all. It reached main unchecked and was rerun by
# hand once somebody noticed, which is the part that does not scale.
#
# So a push is grouped by the commit it checks rather than by the branch it
# landed on. Alone in its group it waits for nothing and nothing waits for it,
# and cancel-in-progress stays an expression rather than becoming false,
# because what it says is still true of a pull request and now says it of a
# push as well. Merges to main are serial in practice, so the parallelism
# this allows is mostly theoretical; what it buys is that a run cannot be
# cancelled by a merge that had nothing to do with it.
concurrency:
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group:
    ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref
    || github.sha }}

# Nothing here writes to the repository. The provision job replaces this
# with id-token: write, which is not a write to the repository either: it
# is the OIDC token Google exchanges for a short-lived credential, and it
# is why there is no service account key in this repository at all.
permissions:
  contents: read

jobs:
  check:
    # The runners this asks for do not exist until the provision job below
    # makes them, which is what this waits on rather than on anything the
    # range job says. The label is scoped to the run, so the pool made for
    # this run is the only thing that can answer and it can answer nothing
    # else. This job and every commit job below share that one pool and
    # queue against it.
    needs: provision
    runs-on: [self-hosted, "run-${{ github.run_id }}"]
    timeout-minutes: 10
    steps:
      # Pinned to digests because renovate.json extends config:best-practices,
      # which includes helpers:pinGitHubActionDigests. Renovate keeps them
      # current; the comment is what makes the digest readable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commitlint needs the commits a pull request adds, not just its tip.
          fetch-depth: 0
          # Nothing here pushes, so there is no reason to leave a token in
          # .git/config where every later step can read it.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .node-version rather than written here, so the version
          # is stated once and Renovate's nodenv manager updates it in one
          # place. Pinned rather than inherited from the runner image, so an
          # image bump cannot silently change the version the suite runs under.
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Reads packageManager from package.json, so the version is stated
          # once and Renovate updates it in one place.
          bun-version-file: package.json

      # setup-bun does not do this, so the entry below is not redundant
      # config. Read at the digest pinned above: its post step is
      # cache-save.ts, whose body is saveCache([state.bunPath]) and nothing
      # else, and its one cache input is no-cache - "Disable caching of bun
      # executable". The binary is all it has ever meant.
      #
      # The path is asked of bun rather than written down. `bun pm cache`
      # resolves BUN_INSTALL_CACHE_DIR, else $BUN_INSTALL/install/cache, else
      # $XDG_CACHE_HOME/.bun/install/cache, else $HOME/.bun/install/cache -
      # confirmed by running it under each. setup-bun sets none of them, so a
      # hardcoded ~/.bun/install/cache is right today and silently a cache
      # that never hits the day one of them is set.
      - id: bun-cache
        run: |
          dir="$(bun pm cache)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key:
            bun-check-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('bun.lock') }}
          # node_modules is deliberately not here and must not be added. bun
          # install --frozen-lockfile does not prune, so a restored tree
          # resolves a dependency the commit no longer declares and the run
          # goes green on a tree that cannot install - the false pass the
          # commit job avoids by checking each commit out onto a cleaned
          # tree.
          # The install cache cannot do that. It is content-addressed, keyed
          # by what was fetched rather than by what is wanted, so a stale
          # entry is dead weight rather than a wrong answer: it can only
          # make an install that was going to happen anyway faster.
          path: ${{ steps.bun-cache.outputs.dir }}
          # Prefixed per job rather than shared with the commit job. Each
          # keys on the lockfile it installs from, and a save onto a key
          # that exists is a no-op, so a shared prefix would race only on
          # identical content; the prefixes stay so a restore reads off its
          # key as the tip's or a commit's.
          #
          # The architecture is in the key because runner.os cannot tell
          # one from the other - an x64 runner and an arm64 one both
          # report Linux - and a prefix that stops at the OS would hand a
          # restore from one to the other. What is in there today would
          # survive that: bun's install cache is keyed by package
          # identity, and a package with a native binary ships it as a
          # separate optional dependency rather than as a variant of
          # itself. That is a property of bun's cache rather than a
          # promise it makes, so the key says which CPU filled it.
          restore-keys: bun-check-${{ runner.os }}-${{ runner.arch }}-

      - id: install
        run: bun install --frozen-lockfile

      # Every check runs even after one fails, so a red run reports everything
      # that is wrong at once. Same reason the pre-commit hook passes
      # --continue-on-error. A failed install is the exception: without
      # node_modules each of these fails on a missing binary rather than on
      # anything it was asked to check, so they are gated on it succeeding.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run format:check
      # A misspelled option in .prettierrc.json is answered with
      # `[warn] Ignored unknown option { printWdith: 80 }. Did you mean
      # printWidth?` on stderr, after which Prettier exits 0 and the step
      # above prints "All matched files use Prettier code style!". Verified
      # with printWdith and tailwindStylesheat together: two warnings, both
      # options doing nothing, format:check green. A plugin option is not a
      # special case - core and plugin options are normalised through the
      # same path, and tailwindStylesheat warns exactly like printWdith.
      #
      # There is no flag that promotes it. Prettier 3.9's CLI has no
      # strict-config equivalent - the whole option list was read, not
      # remembered - and --log-level only silences. Validating
      # .prettierrc.json against getSupportInfo() was tried and rejected:
      # it does work, but it is a second implementation of a check Prettier
      # already performs, one that has to be taught about plugins,
      # overrides and $schema and will go wrong differently. So what
      # Prettier prints is what gets read.
      #
      # format:check is re-run rather than one file probed, because the
      # warning is emitted per formatted file: a typo inside an overrides
      # block only surfaces on a file that override matches. The whole run
      # takes 0.3s. Only stderr is read - the pass/fail verdict belongs to
      # the step above, and failing here for it too would report one
      # problem as two.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          # A grep for a vendor's log line is a check only for as long as
          # the line exists, and Renovate keeps upgrading Prettier. Ask for
          # an option that cannot be real and require the message back.
          canary="$(bunx prettier --stdin-filepath canary.ts \
            --unknown-option-canary=1 </dev/null 2>&1 >/dev/null || true)"
          case "$canary" in
            *"Ignored unknown option"*) ;;
            *)
              echo "::error::Prettier no longer reports an unknown option this way; this check is dead and needs rewriting."
              exit 1
              ;;
          esac

          warnings="$(bun run format:check 2>&1 >/dev/null || true)"
          if printf '%s\n' "$warnings" | grep -q "Ignored unknown option"; then
            printf '%s\n' "$warnings" | grep "Ignored unknown option" | sort -u
            echo "::error::Prettier ignored an option in .prettierrc.json, so it is set to nothing. Fix the spelling."
            exit 1
          fi
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run lint
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run typecheck
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run test:coverage
      # vitest writes an HTML report alongside the text summary and nothing
      # has ever looked at it: the runner is thrown away, so a coverage
      # failure can only be read by reproducing the run locally. Gated on
      # the same condition as every other step rather than on the coverage
      # step succeeding, because a red run is the case this exists for.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # warn rather than error. A suite that died before writing a
          # report has already failed the step above, and failing again for
          # the missing artifact reports one problem as two.
          if-no-files-found: warn
          name: coverage-html
          # Where vitest puts it: coverage.reportsDirectory is unset in
          # vitest.config.mts, so the default, and .gitignore names the
          # same path.
          path: coverage/
          # Long enough to read a failure from the run that produced it.
          # This is a diagnostic, not coverage history.
          retention-days: 7
      # Kept alongside typecheck even though next build type checks too: a
      # type error should fail in seconds rather than after a full build, and
      # the build catches what tsc alone does not.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run build
      # Nothing above reports a dependency that no file imports, or an export
      # that no file reads: both type check and lint perfectly. knip is the
      # only check here that looks for what is absent rather than what is
      # wrong.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: bun run knip

      # Dependabot alerts are on and Renovate raises a pull request for a
      # known vulnerability, but both arrive after the fact: the version is
      # on main by the time either notices. This fails the run that
      # introduces one - a bump pulling in a vulnerable transitive, or a
      # lockfile-maintenance refresh doing the same - at the pull request,
      # where it is cheapest to read. Not gated on the install: it reads
      # bun.lock rather than node_modules, and a lockfile that would not
      # install is still worth auditing.
      #
      # Every severity fails it. An advisory that cannot be fixed is
      # accepted with --ignore, the advisory named here and the reason
      # beside it, the same shape as an eslint-disable and its -- reason.
      # Not with --audit-level, which silences the next one too.
      #
      # GHSA-67mh-4wv8-2f99 is esbuild 0.18's development server answering
      # any origin, fixed in 0.25. The 0.18 copy arrives through
      # drizzle-kit, which declares @esbuild-kit/esm-loader and never loads
      # it: its bundled bin.cjs does not mention the package, and it
      # transpiles the config with the 0.25 esbuild it also declares. A
      # development server that is never started answers nobody. Nothing
      # here can drop the declaration, so the advisory is accepted until
      # drizzle-kit does.
      - if: ${{ !cancelled() }}
        run: bun audit --ignore GHSA-67mh-4wv8-2f99

      # The commit-msg hook is bypassable with --no-verify. This is not, and
      # it runs for a push as well as a pull request. Most of this history
      # landed by direct push to main, which a pull_request-only gate never
      # saw. Merge and squash commits are off in the repository settings, so
      # GitHub composes no message of its own, but a push still carries
      # whatever the author's hook let through or was told to skip.
      #
      # The SHAs go through the environment rather than into the command
      # string, so nothing from the event is interpolated into a shell. The
      # range logic is the commits job's, duplicated rather than shared: a
      # composite action would put it where neither job's comment can
      # explain it. With no usable range the tip is linted alone, from its
      # message on stdin rather than through --from, because a root commit
      # has no parent to name.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          BASE_SHA:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" 2>/dev/null; then
            echo "No usable base commit, or history was rewritten; linting $HEAD_SHA alone."
            git log -1 --format=%B "$HEAD_SHA" | bunx commitlint --verbose
          else
            bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          fi

  range:
    # AGENTS.md requires every commit to stand alone, not only the tip: each
    # one installs from its own lockfile and is green by itself. The check job
    # above only ever sees the tip, so a series that is green at the end and
    # red in the middle passes unnoticed - which is exactly what git bisect
    # later depends on not being true.
    #
    # This job lists the commits to check and the commit job below checks
    # them, one job each. They used to be one job looping over the range,
    # and a series paid for its length in wall clock: four minutes a commit,
    # in order, so twelve were fifty minutes and the loop's timeout had to
    # grow with the longest series. Now a series pays in runners rather than
    # in wall clock, as many at a time as the pool the provision job makes,
    # so it costs its slowest wave rather than its sum.
    #
    # Not while the pull request is a draft. A series is rewritten while it
    # is one, and each rewrite would spend a runner a commit proving a tree
    # the next push replaces; the check job still runs on every push, so a
    # draft is never unchecked, only its middle. Marking it ready runs this
    # for the first time, and every push after that runs it again. A push
    # to main is never a draft and always runs it.
    if:
      ${{ github.event_name != 'pull_request' ||
      !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read is for listing the cache, which is where the commit job
    # leaves its markers. Stated in full because a job's permissions replace
    # the workflow's rather than adding to them.
    permissions:
      actions: read
      contents: read
    outputs:
      commits: ${{ steps.list.outputs.commits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The range is walked here, so the whole history is needed.
          fetch-depth: 0
          persist-credentials: false

      # The SHAs go through the environment rather than into the command
      # string, so nothing from the event is interpolated into a shell. The
      # range logic is the check job's commitlint step's, duplicated rather
      # than shared: a composite action would put it where neither comment
      # can explain it.
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA:
            ${{ github.event_name == 'pull_request' &&
            github.event.pull_request.head.sha || github.sha }}
        run: |
          set -uo pipefail

          # The tip is the check job's: it runs every script there already,
          # on the same tree, and a second run here would answer nothing it
          # has not. So the range stops one short of the head.
          #
          # A new branch reports an all-zero base, and a force push can name a
          # commit that no longer resolves. Either way there is no range, and
          # the check job covers the one commit that can be named, so there is
          # nothing to check here rather than something to fail on.
          # A base that is not an ancestor of the head means history was
          # rewritten: the old tip usually still resolves, so resolvability
          # alone is not enough to detect it, and rev-list would then return
          # every rewritten commit rather than the ones actually pushed.
          if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] ||
             ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null ||
             ! git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA" 2>/dev/null; then
            echo "No usable base commit, or history was rewritten; the check job covers $HEAD_SHA."
            commits=""
          else
            commits="$(git rev-list --reverse "${BASE_SHA}..${HEAD_SHA}" | sed '$d')"
          fi

          # A commit is green standalone as a function of its tree alone,
          # so a tree proven once need not be proven again. The commit job
          # saves a marker under the tree's hash when every script passes,
          # and the list leaves out each commit whose tree has one: a push
          # that adds or amends one commit checks one commit. The markers
          # are looked up over the API rather than restored, since a
          # restore is one key a step and this is a list, and the API sees
          # every cache in the repository whichever branch wrote it, which
          # is right for a fact about a tree. A marker unused for a week is
          # evicted, and a rebase onto a moved main changes every tree;
          # either way the commit is checked again, which costs a runner
          # and nothing else. A lookup that fails is read as no marker, for
          # the same reason.
          #
          # One entry per commit, as the matrix takes it: the sha to check
          # out, the tree to mark, and the short sha and the subject to name
          # the job by. An empty range is an empty list, which the commit
          # job reads as nothing to do.
          list="$(for sha in $commits; do
            tree="$(git rev-parse "${sha}^{tree}")"
            found="$(gh cache list --key "green-tree-$tree" --limit 1 --json key --jq length 2>/dev/null || echo 0)"
            if [ "$found" != "0" ]; then
              echo "$(git rev-parse --short "$sha") is tree $tree, already proven green; skipped" >&2
              continue
            fi
            jq -n --arg sha "$sha" \
              --arg short "$(git rev-parse --short "$sha")" \
              --arg subject "$(git log -1 --format=%s "$sha")" \
              --arg tree "$tree" \
              '{sha: $sha, short: $short, subject: $subject, tree: $tree}'
          done | jq -sc .)"

          echo "Checking $(echo "$list" | jq length) commit(s), one job each."
          echo "commits=$list" >> "$GITHUB_OUTPUT"

  # GitHub bills minutes for the runners it hosts and nothing at all for
  # the ones it does not, and the gate is very nearly the whole bill: the
  # per-commit matrix alone was two thirds of about 1,491 billable minutes
  # a week against an allowance of 2,000 a month. So the orchestration
  # stays where it is, on hosted runners that cost a minute or two a run,
  # and the work moves to n4a - Google Axion, arm64 - where the same gate
  # takes 102 seconds rather than 356 and Google bills it by the second.
  #
  # A pool of VMs, made here, shared by every job below, and removed by the
  # teardown job at the bottom. What this job must never do is wait for any
  # of them. A hosted job that waits on a self-hosted one is billed for the
  # whole wait, which would put back every minute the move was made to
  # save, so it creates the VMs and exits and GitHub's own queue is what
  # joins the two halves: more jobs than runners simply drain in waves, and
  # no job ever falls back to a runner GitHub bills for.
  #
  # The runners are not --ephemeral, which is what makes the waves
  # possible, and that is a real trade rather than a free one. A job no
  # longer gets a runner to itself: an install runs whatever lifecycle
  # scripts its dependencies declare, and on a reused VM those can outlive
  # the job that ran them and be there for the next. What bounds it is the
  # run - the pool is labelled for this run, is reachable by nothing else,
  # and is destroyed with it - and that this is a private repository
  # running its own commits rather than pull requests from strangers.
  #
  # What is not lost is the clean tree each commit is checked on.
  # actions/checkout defaults to clean: true, which is
  # `git clean -ffdx && git reset --hard HEAD` before it fetches - the same
  # `git clean -xdff` the loop this design replaced paid per commit, and it
  # takes node_modules and .next with it. The one thing that survives is
  # bun's install cache, which the check job's comment already explains is
  # content-addressed and so dead weight at worst.
  #
  # Rerunning a failed job on its own does not rerun this one, so the
  # runners it made are long gone and the jobs below would queue against a
  # label nothing answers. Rerun all jobs.
  provision:
    # Not for the range itself - nothing here reads a commit - but for its
    # length, so that a run is provisioned once rather than a matrix leg at
    # a time.
    needs: range
    # range does not run while a pull request is a draft, and it can fail
    # outright. Either way the check job still runs and still needs a
    # runner, so this runs unless the run is cancelled and reads a missing
    # count as nought.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Stated in full because a job's permissions replace the workflow's
    # rather than adding to them. contents is not among them: this job
    # never checks the repository out.
    permissions:
      id-token: write
    env:
      # The zone and the subnet are a pair - a subnet is regional, and
      # this one is the region this zone sits in. n4a is in europe-west1 b
      # and c and in neither of the region's other zones, so -d is not a
      # fallback, and it is not in europe-north1 at all.
      GCP_PROJECT: jonnyoc-infra-shared
      GCP_SUBNET: ci-runners-europe-west1
      GCP_ZONE: europe-west1-b
      # Four n4a-standard-8 is the project's CPUS_ALL_REGIONS quota of 32
      # exactly, and the pool is never larger. More jobs than that is not
      # a problem to solve here: they queue and the pool drains them in
      # waves.
      POOL_MAX: 4
      # Pinned rather than resolved at boot, so a runner release cannot
      # change what a rerun of an old run does. The runner updates itself
      # when GitHub requires a newer one, so this going stale costs a
      # minute at boot rather than a failure. Nothing updates it for us:
      # Renovate's github-actions manager reads `uses:` and not this.
      RUNNER_VERSION: 2.337.0
      # The hard ceiling on a VM's life, armed at boot before anything
      # that can fail. It is a backstop and not the usual end of one:
      # the teardown job removes the pool as soon as the last job is
      # done, and this is what covers the runs where that never happens.
      # Forty-five minutes rather than more because the removal token the
      # shutdown script deregisters with is minted in this job and lasts
      # an hour, and a VM that outlived the token would halt without
      # deregistering and leave an offline runner behind.
      TTL_MINUTES: 45
    steps:
      # Workload Identity Federation rather than a service account key.
      # The key would have to live in a repository secret, never expire
      # until someone rotates it, and be readable by every workflow here;
      # the OIDC token this exchanges is minted per run and lasts an hour.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT }}
          # The provisioning identity, created by the Terraform in
          # lex-imperialis. It is not the identity the VMs run as: that is
          # exactis-ci-runner-vm below, a separate and much narrower
          # account. This one holds actAs on that one and deliberately not
          # on itself, so naming it on --service-account would be refused
          # for want of actAs rather than merely be too broad.
          service_account:
            exactis-ci-runner@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com
          # The provider's resource name carries the project number, so it
          # comes from a repository variable rather than being written
          # here.
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      # ubuntu-latest stopped shipping the Google Cloud CLI when it moved
      # to 24.04, so it is installed rather than assumed.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - env:
          COMMITS: ${{ needs.range.outputs.commits }}
          # Minting a runner token needs Administration: write on this
          # repository, which is not a permission GITHUB_TOKEN can be
          # granted at all - hence a fine-grained token in a secret. What
          # reaches a VM is the minted pair rather than this one: each
          # lasts an hour, one registers a runner and the other removes
          # it, and neither does anything else.
          GH_TOKEN: ${{ secrets.RUNNER_REGISTRATION_PAT }}
          REPO: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail

          # One job for the check job, which always runs, and one for each
          # commit the range job listed - which says nothing at all when it
          # was skipped for a draft or failed outright, and nothing is no
          # commits. The pool is that or POOL_MAX, whichever is smaller:
          # past it the jobs queue rather than the workflow spilling onto
          # runners GitHub bills for.
          legs="$(printf '%s' "${COMMITS:-[]}" | jq 'length' 2>/dev/null || echo 0)"
          jobs=$(( 1 + legs ))
          wanted="$jobs"
          [ "$wanted" -le "$POOL_MAX" ] || wanted="$POOL_MAX"
          label="run-${RUN_ID}"

          names=()
          for n in $(seq 1 "$wanted"); do
            names+=("exactis-ci-${RUN_ID}-${RUN_ATTEMPT}-${n}")
          done

          # Two tokens, both minted here because both need a permission
          # only this job's secret carries. The removal token goes to the
          # VM unused and is spent by the shutdown script, which is why
          # TTL_MINUTES has to stay inside the hour it is good for.
          # `|| true` so that a refusal is answered by the message below
          # rather than by errexit aborting the step on gh's own, which
          # says 403 and nothing about which permission is missing.
          token="$(gh api --method POST \
            "repos/${REPO}/actions/runners/registration-token" --jq .token || true)"
          removal="$(gh api --method POST \
            "repos/${REPO}/actions/runners/remove-token" --jq .token || true)"
          if [ -z "$token" ] || [ -z "$removal" ]; then
            echo "::error::No runner token came back. RUNNER_REGISTRATION_PAT must be set and must hold Administration: write on this repository."
            exit 1
          fi
          echo "::add-mask::$token"
          echo "::add-mask::$removal"

          # Written to a file rather than inlined into --metadata so the
          # quoting has one layer rather than two, and with a quoted
          # heredoc so that nothing in it is expanded by this shell: every
          # value the script wants is read off the metadata server, which
          # keeps the script the same bytes on every VM.
          cat > "$RUNNER_TEMP/startup.sh" <<'STARTUP'
          #!/usr/bin/env bash
          # Root, at boot. GCE runs this on every boot rather than only
          # the first, which for a VM that boots once and is then thrown
          # away is a distinction without a difference - but nothing below
          # assumes it, and --no-restart-on-failure means a crashed VM
          # stays down rather than coming back to run this again.
          #
          # Not set -e. A step that fails must still reach the halt at the
          # end, because a VM that survives its own failure is the only
          # thing here that can quietly cost money.
          set -uo pipefail

          meta() {
            curl -fsS -H 'Metadata-Flavor: Google' \
              "http://metadata.google.internal/computeMetadata/v1/$1"
          }

          # The first thing that happens, and it depends on nothing
          # afterwards succeeding: not on the apt below, not on GitHub
          # ever assigning a job, not on the run that asked for this VM
          # still existing. A cancelled run leaves an idle runner waiting
          # for jobs that are never coming, and without this it waits for
          # ever. The reaper on the Terraform side is a second backstop,
          # not this one's replacement.
          #
          # A runner now serves a queue rather than one job, so the
          # ceiling has to outlast the draining too. The provision job
          # works out what the pool can drain inside it and refuses the
          # run rather than let a leg be lost to the halt.
          #
          # Read from metadata so the number is written in one place, and
          # +0 - halt now - if it cannot be read, because a VM that cannot
          # reach its own metadata server cannot configure a runner
          # either. Guessing at a ceiling would be the one failure this is
          # here to prevent.
          shutdown -h "+$(meta instance/attributes/ttl-minutes || echo 0)"

          export DEBIAN_FRONTEND=noninteractive
          apt-get -qq update
          # Ubuntu's cloud image ships curl, which is why the halt above
          # could already be armed, and none of the rest. git is the one
          # that fails quietly: without it actions/checkout falls back to
          # a tarball of the tree, and fetch-depth has no history to
          # fetch, so commitlint and the range walk would read an empty
          # log rather than error. libatomic1 is Node 26's, unzip is the
          # bun installer's, and jq reads the access token the shutdown
          # script deletes this VM with.
          apt-get -qq install -y git jq libatomic1 unzip

          name="$(meta instance/name)"
          runner_label="$(meta instance/attributes/runner-label)"
          runner_token="$(meta instance/attributes/runner-token)"
          runner_url="$(meta instance/attributes/runner-url)"
          runner_version="$(meta instance/attributes/runner-version)"

          # The runner refuses to run as root without being told to, and
          # being told to would run the gate as root as well.
          useradd --create-home --shell /bin/bash runner
          install --directory --owner=runner --group=runner /opt/runner
          cd /opt/runner
          curl -fsSL "https://github.com/actions/runner/releases/download/v${runner_version}/actions-runner-linux-arm64-${runner_version}.tar.gz" |
            tar --extract --gzip
          ./bin/installdependencies.sh
          chown --recursive runner:runner /opt/runner

          as_runner() { runuser -u runner -- env HOME=/home/runner "$@"; }

          # Not --ephemeral. An ephemeral runner deregisters after one job
          # and would have to be a VM per job, which the quota caps at
          # four; a registration that stays lets the pool drain a queue of
          # any length in waves instead. What that costs is per-job
          # isolation, which the provision job's comment sets out, and
          # what deregisters the runner is the shutdown script rather than
          # the runner itself.
          as_runner ./config.sh --unattended \
            --url "$runner_url" --token "$runner_token" \
            --labels "$runner_label" --name "$name" \
            --work /opt/runner/_work

          # Serves jobs until something stops it. It returns only when the
          # listener has stopped for good - a registration that failed, or
          # the runner removed from the other end - and nothing more will
          # be taken after that, so the VM goes rather than idling to its
          # TTL. The halt is what runs the shutdown script.
          as_runner ./run.sh
          shutdown -h now
          STARTUP

          # Deregistering is the shutdown script's because, without
          # --ephemeral, nothing else does it: a VM that simply vanished
          # would leave an offline runner in the repository's list for
          # every run ever provisioned. It runs on any halt - the TTL, the
          # line above, an operator stopping the instance - and the halt
          # continues whatever it returns.
          cat > "$RUNNER_TEMP/shutdown.sh" <<'SHUTDOWN'
          #!/usr/bin/env bash
          set -uo pipefail

          meta() {
            curl -fsS -H 'Metadata-Flavor: Google' \
              "http://metadata.google.internal/computeMetadata/v1/$1"
          }

          cd /opt/runner || exit 0
          runuser -u runner -- env HOME=/home/runner ./config.sh remove \
            --token "$(meta instance/attributes/removal-token)" || true

          # Deleting the instance is the cleanup that actually happens,
          # rather than leaving a TERMINATED VM for the reaper to find up
          # to fifteen minutes later: the VM's service account is granted
          # compute.instances.delete for exactly this. It is still written
          # as best effort, because a grant that Terraform has but has not
          # applied, or an API that is briefly unavailable, must strand
          # nothing - and behind it the halt carries on and the reaper
          # takes anything labelled purpose=exactis-ci that is over an
          # hour old.
          #
          # Over the API rather than with gcloud, which Ubuntu's image
          # does not ship.
          access="$(meta instance/service-accounts/default/token | jq -r .access_token)"
          curl -fsS -X DELETE -H "Authorization: Bearer $access" \
            "https://compute.googleapis.com/compute/v1/projects/$(meta project/project-id)/zones/$(basename "$(meta instance/zone)")/instances/$(meta instance/name)" ||
            echo "self-delete refused; halting for the reaper instead"
          SHUTDOWN

          # An external IP, which is the default and is left to be: the VM
          # has to reach nodejs.org, the npm registry and github.com, and
          # Cloud NAT costs more than the runners do. Nothing can reach
          # back - the firewall rule on this network opens SSH to the IAP
          # range and to nothing else - so administration is by IAP tunnel.
          #
          # purpose=exactis-ci is what the reaper keys off and is not
          # optional. The run labels are this job's own, for the teardown
          # below.
          #
          # The names are exactis-ci-<run id>-<attempt>-<n>, and the prefix
          # is load-bearing rather than decorative: the IAM condition on
          # the VM service account's delete permission is written against
          # it, so a VM named outside the prefix could not delete itself.
          #
          # --service-account names the narrow VM identity rather than the
          # account this job authenticated as. That one holds actAs on
          # this one and not on itself, so naming itself here would be
          # refused outright.
          created="$(gcloud compute instances create "${names[@]}" \
            --boot-disk-size=100GB \
            --boot-disk-type=hyperdisk-balanced \
            --format='value(name)' \
            --image-family=ubuntu-2404-lts-arm64 \
            --image-project=ubuntu-os-cloud \
            --labels="purpose=exactis-ci,run_attempt=${RUN_ATTEMPT},run_id=${RUN_ID}" \
            --machine-type=n4a-standard-8 \
            --metadata="removal-token=${removal},runner-label=${label},runner-token=${token},runner-url=https://github.com/${REPO},runner-version=${RUNNER_VERSION},ttl-minutes=${TTL_MINUTES}" \
            --metadata-from-file="shutdown-script=${RUNNER_TEMP}/shutdown.sh,startup-script=${RUNNER_TEMP}/startup.sh" \
            --network=ci-runners \
            --no-restart-on-failure \
            --project="$GCP_PROJECT" \
            --scopes=https://www.googleapis.com/auth/cloud-platform \
            --service-account="exactis-ci-runner-vm@${GCP_PROJECT}.iam.gserviceaccount.com" \
            --subnet="$GCP_SUBNET" \
            --zone="$GCP_ZONE" || true)"
          count="$(printf '%s\n' "$created" | grep -c . || true)"

          # Nothing at all is the failure that matters, and it has to be
          # loud: a job whose runner was never made does not fail, it
          # queues for twenty-four hours and then reports something that
          # reads nothing like "there was no runner". A short count is a
          # different matter now that runners are not ephemeral - the
          # jobs drain over however many there are - so it is reported and
          # carried, and only an empty pool stops the run.
          if [ "$count" -eq 0 ]; then
            echo "::error::GCE created no runners at all, so every job below would queue against a label nothing answers. The usual cause is the CPUS_ALL_REGIONS quota of 32, which is four n4a-standard-8 and no more, with another run holding them. Rerun all jobs."
            exit 1
          fi
          if [ "$count" -ne "$wanted" ]; then
            echo "::warning::Asked GCE for $wanted runner(s) and got $count; the jobs will drain over the ones there are. The usual cause is another run holding part of the CPUS_ALL_REGIONS quota."
          fi

          # The pool has to be able to drain the queue inside the TTL,
          # because a VM that halts mid-job takes the job with it and one
          # that halts with legs still queued loses them to a
          # twenty-four hour wait. Five minutes covers boot and the last
          # job's overrun; three is what a leg takes with install and the
          # whole gate, against the 102 seconds the suite alone measures.
          # Four runners and forty-five minutes is fifty-three jobs,
          # which is a far longer series than the green-tree markers ever
          # leave to check - and if it is ever reached, it is reached
          # here rather than discovered as a job that never ran.
          capacity=$(( count * (TTL_MINUTES - 5) / 3 ))
          if [ "$jobs" -gt "$capacity" ]; then
            echo "::error::$jobs job(s) to run but $count runner(s) can only drain about $capacity inside the ${TTL_MINUTES}-minute TTL. Raise TTL_MINUTES - it must stay under the hour the removal token lasts - or split the push."
            mapfile -t made < <(gcloud compute instances list \
              --filter="labels.purpose=exactis-ci AND labels.run_id=${RUN_ID} AND labels.run_attempt=${RUN_ATTEMPT}" \
              --format='value(name)' \
              --project="$GCP_PROJECT" \
              --zones="$GCP_ZONE")
            if [ "${#made[@]}" -gt 0 ]; then
              gcloud compute instances delete "${made[@]}" \
                --project="$GCP_PROJECT" --quiet --zone="$GCP_ZONE"
            fi
            exit 1
          fi

          echo "$count runner(s) booting as $label for $jobs job(s), draining in waves and halting at ${TTL_MINUTES} minutes. Budget about 60-90 seconds before the first is ready."

  commit:
    needs: [provision, range]
    if: ${{ needs.range.outputs.commits != '[]' }}
    name: commit ${{ matrix.short }} ${{ matrix.subject }}
    # The same pool the check job uses, and no leg ever falls back to a
    # runner GitHub bills for: a series longer than the pool queues
    # against it and drains in waves. What that costs in wall clock is a
    # wave at a time; what it saves is the whole of the matrix's bill.
    runs-on: [self-hosted, "run-${{ github.run_id }}"]
    # A guard against a hang, not a budget: one commit was about four
    # minutes on a GitHub runner and is under two on a provisioned one,
    # install and every script. It counts from when a runner picks the job
    # up, so the queueing above does not eat into it.
    timeout-minutes: 15
    strategy:
      # Every commit is reported, not only the first to fail, so a red
      # series says everything that is wrong with it at once.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.range.outputs.commits) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.sha }}
          # This job runs historical code. A token left in .git/config is
          # readable by it.
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - id: bun-cache
        run: |
          dir="$(bun pm cache)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Keyed on this commit's own lockfile, which is what it installs
          # from. Most of a series shares one, so the first job to finish
          # saves the entry and the rest find it already there; a series
          # that changes the lockfile mid-way saves one entry per lockfile.
          # node_modules stays out, and the architecture is in the key,
          # for the reasons given in the check job.
          key:
            bun-commits-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('bun.lock') }}
          path: ${{ steps.bun-cache.outputs.dir }}
          restore-keys: bun-commits-${{ runner.os }}-${{ runner.arch }}-

      # A clean tree, so there is nothing to clean here: no node_modules
      # from another commit for bun install to leave unpruned, no stale
      # .next/types for tsc to read. On a GitHub runner that is because
      # the runner is fresh. On a provisioned one, which may already have
      # run another leg of this same series, it is because the checkout
      # above defaults to clean: true - `git clean -ffdx` and a hard
      # reset before it fetches - which is the `git clean -xdff` the loop
      # this design replaced paid per commit, done by the step that was
      # going to run anyway.
      #
      # What that does not clean is anything outside the workspace: the
      # tool cache, $HOME, and whatever a dependency's install script
      # decided to write. The provision job's comment says what that
      # costs and why it is accepted.
      - env:
          SHORT: ${{ matrix.short }}
          SUBJECT: ${{ matrix.subject }}
        run: |
          set -uo pipefail

          ok=true
          bun install --frozen-lockfile || ok=false

          if [ "$ok" = true ]; then
            # Whatever this commit defines as green, not what the tip does.
            # A commit predating a script has not failed it. Absent is
            # exit 3 and nothing else: node answers an uncaught exception
            # with 1, so reading 1 as absent would turn a package.json
            # that cannot be parsed into a commit with nothing to run.
            # Any other status is the probe breaking, which is a failure
            # rather than a reason to skip.
            for script in format:check lint typecheck test:coverage build knip; do
              # The probe must not run bare: GitHub runs this with
              # `bash -e`, so a non-zero exit would abort the whole loop
              # before the code could be read. `|| probe=$?` puts it in an
              # OR list, which errexit exempts.
              probe=0
              node -e "process.exit(require('./package.json').scripts?.['$script'] ? 0 : 3)" || probe=$?
              if [ "$probe" -eq 3 ]; then
                echo "no $script script at this commit; skipped"
                continue
              fi
              if [ "$probe" -ne 0 ]; then
                echo "::error::probing for the $script script exited $probe"
                ok=false
                continue
              fi
              bun run "$script" || ok=false
            done
          fi

          if [ "$ok" = false ]; then
            echo "::error::$SHORT ($SUBJECT) is not green on its own"
            exit 1
          fi
          echo "$SHORT stands alone."

      # The marker the range job looks for, saved under the tree's hash
      # once every script has passed and not otherwise, since a failed step
      # above ends the job. What is saved does not matter; that the key
      # exists is the fact.
      - env:
          TREE: ${{ matrix.tree }}
        run: |
          mkdir -p .green
          echo "$TREE" > .green/tree
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: green-tree-${{ matrix.tree }}
          path: .green

  # The TTL is a backstop rather than a plan. A run whose jobs are done in
  # five minutes would otherwise leave its VMs idling out the other forty,
  # which is the greater part of what moving off hosted runners was for -
  # the bill only changes hands, from GitHub to Google. This job is what
  # ends them at the moment there is nothing left to run.
  #
  # It is a hosted job and it costs hosted minutes, but only the twenty
  # seconds it runs for: a job waiting on `needs` is queued rather than
  # executing, and GitHub bills execution. That is a different thing from
  # the provision job polling for a self-hosted job to finish, which would
  # be execution and is what that job must never do.
  #
  # always(), because a red check job, a failed leg and a cancelled run
  # all leave exactly the same VMs behind as a green one. Skipped when
  # provision did not succeed, which is the one case where there is
  # nothing of its making to remove.
  teardown:
    needs: [check, commit, provision]
    if: ${{ always() && needs.provision.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
    env:
      GCP_PROJECT: jonnyoc-infra-shared
      GCP_ZONE: europe-west1-b
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ env.GCP_PROJECT }}
          service_account:
            exactis-ci-runner@${{ env.GCP_PROJECT }}.iam.gserviceaccount.com
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - env:
          GH_TOKEN: ${{ secrets.RUNNER_REGISTRATION_PAT }}
          REPO: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail

          # Deregistered from here rather than left to each VM's shutdown
          # script, which gets a short and best-effort window when an
          # instance is deleted out from under it. Removing a runner also
          # tells its listener to stop, so a VM commonly halts and deletes
          # itself before the delete below reaches it - which is why
          # everything here tolerates a thing that has already gone. The
          # shutdown script stays for every path this job does not cover:
          # the TTL, a crash, a run cancelled before this could run.
          #
          # Nothing here can catch a busy runner. Every job that could be
          # holding one is named in `needs` and has finished.
          prefix="exactis-ci-${RUN_ID}-${RUN_ATTEMPT}-"
          ids="$(gh api "repos/${REPO}/actions/runners" --paginate |
            jq -r --arg p "$prefix" \
              '.runners[] | select(.name | startswith($p)) | .id' || true)"
          for id in $ids; do
            gh api --method DELETE "repos/${REPO}/actions/runners/${id}" || true
          done

          mapfile -t made < <(gcloud compute instances list \
            --filter="labels.purpose=exactis-ci AND labels.run_id=${RUN_ID} AND labels.run_attempt=${RUN_ATTEMPT}" \
            --format='value(name)' \
            --project="$GCP_PROJECT" \
            --zones="$GCP_ZONE")
          if [ "${#made[@]}" -gt 0 ]; then
            gcloud compute instances delete "${made[@]}" \
              --project="$GCP_PROJECT" --quiet --zone="$GCP_ZONE" || true
          fi

          echo "Removed ${#made[@]} instance(s) and the registrations for $prefix."
